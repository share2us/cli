name: release

# Build the CLI for every supported platform and publish a GitHub Release.
# install.sh and the /v1/cli/update manifest download these assets.
#
# DELIBERATE, NOT AUTOMATIC. This used to fire on every push to main touching
# Go files, which meant merging ANY change shipped a new build to every
# installed CLI -- three releases went out in 41 minutes on 2026-09-02 with no
# release notes. Cutting a release is now an explicit action.
#
#   channel=beta   -> published as a PRE-RELEASE, without --latest.
#                     GitHub's /releases/latest keeps pointing at the last
#                     stable, and since both the manifest redirect and the GUI
#                     updater resolve "latest", a beta is invisible to existing
#                     users by construction. This is the staging channel.
#   channel=stable -> published with --latest. Users get it.
# A merge to `main` publishes a STABLE release. That is safe now in a way it was
# not before: `main` is reached only through a reviewed PR from a release branch,
# after the work has been exercised on local `staging`, so a merge IS the decision
# to ship. Before, `main` doubled as the working branch, which is how three
# releases went out in 41 minutes with no notes.
#
# The changelog gate still applies — a stable release FAILS when
# CHANGELOG.md's [Unreleased] section is empty, so a merge cannot ship silence.
#
# workflow_dispatch stays for BETA: a pre-release cannot be produced by a merge,
# because a push carries no channel choice.
on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      # NOTE: packaging/** (nfpm, winget generator) is deliberately NOT a trigger —
      # a manifest/generator edit must not cut a release; it applies at the next
      # code release, which regenerates apt + winget from the current packaging/.
  workflow_dispatch:
    inputs:
      channel:
        description: "stable = released to all users; beta = pre-release, not served as latest"
        required: true
        default: beta
        type: choice
        options: [beta, stable]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      # Optional Windows code signing. Absent by default, and the build is
      # unchanged when it is absent — see the "Prepare Windows signing" step.
      SIGN_PFX_B64: ${{ secrets.SIGN_PFX_B64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          check-latest: true

      # Windows Smart App Control blocks UNSIGNED executables outright: no per-file
      # unblock, and clearing the mark-of-the-web does not help. A real user hit
      # this on `s2u login` (todo §RR). No code change makes an unsigned binary
      # pass, so the only fix is a signature from a certificate Windows already
      # trusts — which the project does not have yet (paid signing is blocked for
      # a Pakistani individual, see [[share2us-gui-signing]]).
      #
      # This wires the signing so it starts happening the DAY a certificate
      # exists, with no workflow edit under time pressure. Absent the secret the
      # build is byte-for-byte what it was.
      #
      # Deliberately NO self-signed fallback, unlike the GUI. The GUI falls back
      # because its updater pins a publisher thumbprint and needs *a* signature.
      # For the CLI a self-signed signature would satisfy nothing — Smart App
      # Control still refuses it — while making the binary LOOK signed to anyone
      # inspecting it. Unsigned and honest beats signed by nobody.
      - name: Prepare Windows signing (skipped unless a certificate is configured)
        id: winsign
        run: |
          set -euo pipefail
          if [ -z "${SIGN_PFX_B64:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SIGN_PFX_B64 is not set - the Windows CLI ships unsigned (todo RR)."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq osslsigncode
          printf '%s' "$SIGN_PFX_B64" | base64 -d > "$RUNNER_TEMP/signing.pfx"
          # -readpass, not -pass: a password on the command line is visible in the
          # process list to anything else on the runner.
          printf '%s' "${SIGN_PFX_PASSWORD:-}" > "$RUNNER_TEMP/signing.pass"
          chmod 600 "$RUNNER_TEMP/signing.pfx" "$RUNNER_TEMP/signing.pass"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Windows binaries will be Authenticode-signed."

      - name: Build all platforms
        env:
          SIGN_ENABLED: ${{ steps.winsign.outputs.enabled }}
        run: |
          set -euo pipefail
          VERSION="$(date -u +%Y%m%d%H%M%S)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          export CGO_ENABLED=0
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${platform%/*}"; arch="${platform#*/}"
            echo "==> building $os/$arch"
            # Windows ships share2us.exe in a .zip; everything else a bare
            # binary in a .tar.gz.
            if [ "$os" = windows ]; then bin=share2us.exe; else bin=share2us; fi
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/share2us/cli-core.BuildVersion=$VERSION" \
              -o "dist/$bin" .
            if [ "$os" = windows ]; then
              # Sign before archiving, so the signature is what users extract.
              # Timestamped, so signatures stay valid after the certificate expires.
              if [ "${SIGN_ENABLED:-false}" = true ]; then
                osslsigncode sign \
                  -pkcs12 "$RUNNER_TEMP/signing.pfx" -readpass "$RUNNER_TEMP/signing.pass" \
                  -h sha256 -ts http://timestamp.digicert.com \
                  -n "Share2Us CLI" -i https://share2.us \
                  -in "dist/$bin" -out "dist/$bin.signed"
                mv "dist/$bin.signed" "dist/$bin"
                osslsigncode verify -in "dist/$bin" > /dev/null
                echo "    signed $bin"
              fi
              archive="share2us_${os}_${arch}.zip"
              ( cd dist && zip -q -X "$archive" "$bin" )
            else
              archive="share2us_${os}_${arch}.tar.gz"
              tar -C dist -czf "dist/$archive" "$bin"
            fi
            # Keep the linux binaries for the .deb build below.
            if [ "$os" = linux ]; then mkdir -p "dist/deb/$arch" && cp "dist/$bin" "dist/deb/$arch/share2us"; fi
            rm -f "dist/$bin"
            # crc32 sidecar for install.sh and the `s2u update` manifest;
            # sha256 for install.ps1 (Windows has no cksum, but has Get-FileHash).
            ( cd dist \
              && cksum "$archive" > "$archive.crc32" \
              && sha256sum "$archive" | awk '{print $1}' > "$archive.sha256" )
          done

          # Debian packages (package `s2u`, /usr/bin/share2us + s2u symlink) for
          # `sudo apt install s2u`; attached to the release and published to the
          # apt repository below. nfpm is Go-native, so no extra toolchain.
          for arch in amd64 arm64; do
            cp "dist/deb/$arch/share2us" dist/deb/share2us
            VERSION="$VERSION" ARCH="$arch" go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1 \
              package -f packaging/nfpm.yaml -p deb -t dist/
          done
          rm -rf dist/deb
          ( cd dist && for f in *.deb; do sha256sum "$f" | awk '{print $1}' > "$f.sha256"; done )
          ls -la dist

      # Generate manifest.json for `s2u update` and ship it AS A RELEASE ASSET, so
      # github.com/share2us/cli/releases/latest/download/manifest.json is the single
      # source of truth. share2.us/downloads/manifest.json (and the archives) 302 to
      # the matching release asset via a static firebase.json redirect, so nothing is
      # published to the marketing repo per release. Covers every platform the build
      # produced; crc32/size_bytes come from the dist/ cksum sidecars and the client
      # verifies each redirected download against them.
      - name: Generate update manifest
        run: |
          set -euo pipefail
          platforms="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
          assets='{}'
          for platform in $platforms; do
            os="${platform%/*}"; arch="${platform#*/}"
            if [ "$os" = windows ]; then archive="share2us_${os}_${arch}.zip"; else archive="share2us_${os}_${arch}.tar.gz"; fi
            # cksum sidecar is "<crc32> <size_bytes> <name>"; the .sha256 sidecar is the
            # bare digest. The digest is REQUIRED by `s2u update` from the build that
            # pins its download source (§AJ #4): a manifest without it is refused.
            read -r crc size _ < "dist/$archive.crc32"
            sha=$(cat "dist/$archive.sha256")
            assets=$(jq --arg p "$platform" --arg a "$archive" --arg c "$crc" --argjson s "$size" --arg h "$sha" \
              '.[$p] = {archive: $a, crc32: $c, size_bytes: $s, sha256: $h}' <<<"$assets")
          done
          jq -n --arg v "$VERSION" --argjson assets "$assets" \
            '{latest_version: $v, assets: $assets}' > dist/manifest.json
          echo "== manifest =="; cat dist/manifest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Release notes come from CHANGELOG.md's [Unreleased] section when it
          # has content, so a stable release cannot go out as a bare "automated
          # build from <sha>" line. Falls back to the sha only for a beta.
          NOTES_FILE=notes.md
          unreleased() { awk '/^## \[Unreleased\]/{f=1;next} /^## /{f=0} f' CHANGELOG.md | sed '/<!--/,/-->/d'; }
          # Capture ONCE, then test the captured text. The previous form piped
          # into `grep -q`, which exits on its first match and closes the pipe;
          # sed then dies of SIGPIPE ("couldn't flush stdout: Broken pipe") and
          # under `set -o pipefail` that made the condition false, so a
          # PERFECTLY GOOD changelog was reported empty and the release aborted.
          # It is a race on how fast sed drains, so it failed intermittently —
          # it blocked release 20260907101315 while the identical changelog had
          # released fine ten minutes earlier. `tr` reads all of its input, so
          # there is no early close and nothing to race.
          NOTES=""
          if [ -f CHANGELOG.md ]; then NOTES="$(unreleased)"; fi
          if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$NOTES" > "$NOTES_FILE"
          else
            if [ "${{ inputs.channel || 'stable' }}" != stable ]; then
              echo "Beta build from ${GITHUB_SHA}. Not served to stable users." > "$NOTES_FILE"
            elif [ "${{ github.event_name }}" = workflow_dispatch ]; then
              # A person asked for this release by hand and there is nothing to
              # tell anyone about it. Refusing loudly is right.
              echo "::error::CHANGELOG.md [Unreleased] is empty - a stable release needs release notes."
              exit 1
            else
              # Reached by a merge to main. An empty [Unreleased] is the author
              # saying this changed nothing a user sees - a refactor, a test, a CI
              # tweak - so nothing ships. This used to fail the run, which painted
              # the build red for doing the right thing; a red build nobody can act
              # on is one everybody learns to ignore. Matches the gui.
              echo "::notice::[Unreleased] is empty - nothing user-facing to ship, so no release was cut for ${GITHUB_SHA}."
              exit 0
            fi
          fi
          printf '\n\nInstall: `curl -fsSL https://share2.us/install.sh | sh`\n' >> "$NOTES_FILE"

          if [ "${{ inputs.channel || 'stable' }}" = stable ]; then
            LATEST_FLAGS="--latest"
          else
            LATEST_FLAGS="--prerelease --latest=false"
          fi
          # shellcheck disable=SC2086
          gh release create "v${VERSION}" dist/*.tar.gz dist/*.zip dist/*.deb dist/*.crc32 dist/*.sha256 dist/manifest.json \
            --title "Share2Us CLI ${VERSION}" \
            --notes-file "$NOTES_FILE" \
            $LATEST_FLAGS

          # Roll [Unreleased] under the version that just shipped, so the NEXT
          # release does not republish these notes. This was manual and got
          # skipped, which is why 20260908065959 told people about the tailnet
          # discover, the Windows daemon and the GPLv3 relicense - all of which
          # had shipped in earlier releases. The gui automated this first; same
          # script, same reasoning.
          #
          # It runs for a stable release from EITHER trigger. It used to run only
          # on a push, on the reasoning that a hand-run release should not rewrite
          # the file under the operator - which reads well and was wrong. What
          # decides whether the notes have shipped is the CHANNEL, not the button:
          # a dispatched stable publishes [Unreleased] to every user just as a
          # merge does. 20260910063046 was dispatched, so its notes were still
          # sitting in [Unreleased] afterwards, queued to ship a second time, and
          # had to be filed by hand. A beta is exempt because its notes are
          # generated and it reaches nobody who did not opt in.
          #
          # Guarded on the default branch instead, so a dispatch aimed at some
          # other ref warns rather than committing to it.
          if [ "${{ inputs.channel || 'stable' }}" = stable ] && [ "${GITHUB_REF_NAME}" = "${{ github.event.repository.default_branch }}" ]; then
            python3 - "$VERSION" <<'ROLL'
          import datetime, re, sys
          version = sys.argv[1]
          text = open('CHANGELOG.md').read()
          marker = '## [Unreleased]'
          start = text.index(marker) + len(marker)
          nxt = text.find('\n## [', start)
          body = text[start:nxt if nxt != -1 else len(text)]
          content = re.sub(r'<!--.*?-->', '', body, flags=re.S).strip()
          if content:
              kept = re.findall(r'<!--.*?-->', body, flags=re.S)
              header = marker + '\n\n' + ('\n'.join(kept) + '\n\n' if kept else '')
              rolled = f'## [{version}] - {datetime.date.today().isoformat()}\n\n{content}\n'
              text = text[:text.index(marker)] + header + rolled + text[nxt if nxt != -1 else len(text):]
              open('CHANGELOG.md', 'w').write(text)
              print(f'rolled [Unreleased] under {version}')
          else:
              print('[Unreleased] was empty; nothing to roll')
          ROLL
            if ! git diff --quiet CHANGELOG.md; then
              git config user.name  "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add CHANGELOG.md
              git commit -m "docs(changelog): roll [Unreleased] under ${VERSION}"
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::could not push the changelog roll; do it by hand"
            fi
          elif [ "${{ inputs.channel || 'stable' }}" = stable ]; then
            echo "::warning::stable release cut from ${GITHUB_REF_NAME}, not ${{ github.event.repository.default_branch }} - [Unreleased] was NOT rolled. Roll it by hand or the next release republishes these notes."
          fi

      # Publish the apt repository: a signed static tree on the gh-pages branch of
      # THIS repo (served by GitHub Pages at https://apt.share2.us). Same-repo push,
      # so the workflow token suffices — no deploy key. Suite follows the channel:
      # stable (merge to main) or beta (dispatch); each suite carries its latest
      # build only, older ones stay on GitHub Releases. Skips cleanly when the
      # signing key secret is not set.
      - name: Publish apt repository
        if: env.APT_GPG_PRIVATE_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq dpkg-dev apt-utils >/dev/null
          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          SUITE="${{ inputs.channel || 'stable' }}"
          git clone --quiet --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          APT_GPG_KEY_ID="$KEY_ID" scripts/apt-repo.sh "$SUITE" site dist/*.deb
          gpg --export "$KEY_ID" > site/share2us-apt.gpg
          gpg --export --armor "$KEY_ID" > site/share2us-apt.asc
          cd site
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -q -m "apt: ${SUITE} ${VERSION}" || { echo "apt repo unchanged"; exit 0; }
          git push -q origin gh-pages
          echo "apt repo published: suite=${SUITE} version=${VERSION}"

      # Winget: regenerate the three-file manifest for this release and attach it to
      # the GitHub release (so it can always be submitted by hand), then, when
      # WINGET_TOKEN is set, open/update the microsoft/winget-pkgs PR via komac.
      # Stable only; best-effort — a winget hiccup never fails the release. The FIRST
      # submission of a new package is moderated by Microsoft; komac handles new + update.
      - name: Winget manifest + submission
        # Best-effort: attaching manifests / submitting to winget must never fail
        # the release or block the npm publish that follows it.
        continue-on-error: true
        if: ${{ (inputs.channel || 'stable') == 'stable' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$VERSION" bash packaging/winget/generate.sh
          MANI="packaging/winget/manifests/${VERSION}"
          gh release upload "v${VERSION}" "$MANI"/*.yaml --clobber
          if [ -z "${WINGET_TOKEN:-}" ]; then
            echo "WINGET_TOKEN not set - manifest attached to the release; submit by hand or set the secret."
            exit 0
          fi
          # komac: single Linux binary from its GitHub releases (pinned).
          KOMAC_VER=2.11.2
          curl -fsSL -o /tmp/komac.tar.gz "https://github.com/russellbanks/Komac/releases/download/v${KOMAC_VER}/komac-${KOMAC_VER}-x86_64-unknown-linux-gnu.tar.gz" || { echo "komac download failed; manifest still attached"; exit 0; }
          tar -xzf /tmp/komac.tar.gz -C /tmp || { echo "komac extract failed; manifest still attached"; exit 0; }
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          # `komac update` creates the PR (and works for a first submission too), pulling
          # metadata from the manifest we just generated. Best-effort.
          /tmp/komac update Share2Us.CLI \
            --version "${VERSION}" \
            --urls "${BASE}/share2us_windows_amd64.zip" "${BASE}/share2us_windows_arm64.zip" \
            --submit --token "${WINGET_TOKEN}" || echo "komac submit failed; manifest is attached to the release for a manual PR."

      # Publish the npm wrapper (@share2us/cli), pinned to this exact release so a
      # given npm version always installs the same binary.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish @share2us/cli to npm
        if: env.NPM_TOKEN != ''
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # GPL-3.0-only: the licence text must travel with the package, and npm
          # packs this directory alone. Copied at publish time so the repo keeps
          # ONE copy of the licence rather than a duplicate that can drift.
          cp ../LICENSE ./LICENSE
          npm pkg set "share2usCliVersion=v${VERSION}"
          npm version "0.1.${GITHUB_RUN_NUMBER}" --no-git-tag-version --allow-same-version
          # npm is a SECOND user-facing channel: publishing without a dist-tag
          # makes it `latest`, so `npm i @share2us/cli` would hand a beta to
          # everyone regardless of what the GitHub release says.
          if [ "${{ inputs.channel || 'stable' }}" = stable ]; then
            npm publish --access public
          else
            npm publish --access public --tag beta
          fi
